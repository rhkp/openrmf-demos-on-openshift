fullnameOverride: rmf-office-demo

app:
  name: openrmf-office-demo

namespace:
  name: arhkp1-openrmf

image:
  fullRef: quay.io/rhkp/openrmf-openshift-office-demo:nav2-sensors
  pullPolicy: Always

pullSecret:
  name: ""

serviceAccount:
  create: false
  name: rmf-demo

demo:
  name: office
  launchFile: office.launch.xml

# Robot-as-individual-pod architecture configuration
robots:
  enabled: true   # Enable robot-as-pod architecture
  fleet_name: "tinyRobot"
  instances:
    - name: tinyRobot1
    - name: tinyRobot2
    - name: tinyRobot3
    - name: tinyRobot4
  resources:
    requests:
      cpu: "3"        # Increased for nav2 + SLAM processing
      memory: "6Gi"   # Increased for mapping memory
    limits:
      cpu: "4"
      memory: "8Gi"
  # Fleet coordinator for centralized task assignment
  fleetCoordinator:
    enabled: true  # Deploy fleet coordinator when robots.enabled=true
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

dispatch:
  command: /opt/rmf/demos/office/scripts/dispatch-task.sh
  readyWaitSeconds: 30
  # Robot-as-pod mode dispatch (optional)
  robotMode:
    enabled: true  # Enable automatic task dispatch in robot-pod mode
    command: /opt/rmf/scripts/dispatch-rmf-patrol-wrapper.sh
    readyWaitSeconds: 90

rmfWeb:
  enabled: true
  serverUri: ws://rmf-office-demo-api:80/_internal
  apiServer:
    image: quay.io/rhkp/openrmf-rmf-web-zenoh:latest
    pullPolicy: Always
    rmwImplementation: rmw_zenoh_cpp
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  dashboard:
    image: ghcr.io/open-rmf/rmf-web/demo-dashboard:jazzy-nightly
    nginxImage: nginxinc/nginx-unprivileged:alpine
    pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  routes:
    enabled: false
    clusterDomain: apps.ai-dev01.kni.syseng.devcluster.openshift.com
    dashboardHost: rmf-office-dashboard-arhkp1-openrmf
    apiHost: rmf-office-api-arhkp1-openrmf
    trajectoryHost: rmf-office-traj-arhkp1-openrmf
  portForward:
    dashboardPort: "3000"

novnc:
  enabled: true
  image: quay.io/rhkp/openrmf-openshift-office-demo:novnc
  pullPolicy: Always
  vncPort: 5900
  webPort: 8080
  displayWidth: 1920
  displayHeight: 1080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  routes:
    enabled: false
    clusterDomain: apps.ai-dev01.kni.syseng.devcluster.openshift.com
    novncHost: rmf-office-novnc-arhkp1-openrmf

zenoh:
  enabled: true
  image: quay.io/rhkp/openrmf-zenoh-router:latest
  pullPolicy: Always
  port: 7447
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

shm:
  sizeLimit: 64Mi

resources:
  simulation:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  simulationViz:
    requests:
      cpu: "3"
      memory: 6Gi
    limits:
      cpu: "6"
      memory: 10Gi
  # When robots.enabled=true, simulation becomes world-only with sensor support
  simulationWorldOnly:
    requests:
      cpu: "2"          # Increased for sensor plugins
      memory: "4Gi"
    limits:
      cpu: "3"
      memory: "6Gi"
  simulationWorldOnlyViz:
    requests:
      cpu: "4"
      memory: 6Gi
      nvidia.com/gpu: "1"
    limits:
      cpu: "6"
      memory: 10Gi
      nvidia.com/gpu: "1"
  fleetMonitor:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  taskDispatch:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # New: Fleet coordinator for robot-as-pod architecture
  fleetCoordinator:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  yieldController:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
