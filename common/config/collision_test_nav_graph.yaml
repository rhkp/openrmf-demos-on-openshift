levels:
  L1:
    vertices:
      # Cardinal endpoints (robot start/end positions)
      - [-4.0, 0.0, {name: "wp_west", is_holding_point: true, is_parking_spot: true}]
      - [4.0, 0.0, {name: "wp_east", is_holding_point: true, is_parking_spot: true}]
      - [0.0, 4.0, {name: "wp_north", is_holding_point: true, is_parking_spot: true}]
      - [0.0, -4.0, {name: "wp_south", is_holding_point: true, is_parking_spot: true}]
      # Cardinal midpoints (junctions to bypass ring)
      - [-1.5, 0.0, {name: "wp_west_mid", is_holding_point: true}]
      - [1.5, 0.0, {name: "wp_east_mid", is_holding_point: true}]
      - [0.0, 1.5, {name: "wp_north_mid", is_holding_point: true}]
      - [0.0, -1.5, {name: "wp_south_mid", is_holding_point: true}]
      # Center intersection
      - [0.0, 0.0, {name: "wp_center", is_holding_point: true}]
      # Bypass ring corners
      - [-1.5, 1.5, {name: "bp_nw", is_holding_point: true}]
      - [1.5, 1.5, {name: "bp_ne", is_holding_point: true}]
      - [1.5, -1.5, {name: "bp_se", is_holding_point: true}]
      - [-1.5, -1.5, {name: "bp_sw", is_holding_point: true}]
    lanes:
      # E-W corridor: wp_west(0) -- wp_west_mid(4) -- wp_center(8) -- wp_east_mid(5) -- wp_east(1)
      - [0, 4, {speed_limit: 0.15}]
      - [4, 0, {speed_limit: 0.15}]
      - [4, 8, {speed_limit: 0.15}]
      - [8, 4, {speed_limit: 0.15}]
      - [8, 5, {speed_limit: 0.15}]
      - [5, 8, {speed_limit: 0.15}]
      - [5, 1, {speed_limit: 0.15}]
      - [1, 5, {speed_limit: 0.15}]
      # N-S corridor: wp_north(2) -- wp_north_mid(6) -- wp_center(8) -- wp_south_mid(7) -- wp_south(3)
      - [2, 6, {speed_limit: 0.15}]
      - [6, 2, {speed_limit: 0.15}]
      - [6, 8, {speed_limit: 0.15}]
      - [8, 6, {speed_limit: 0.15}]
      - [8, 7, {speed_limit: 0.15}]
      - [7, 8, {speed_limit: 0.15}]
      - [7, 3, {speed_limit: 0.15}]
      - [3, 7, {speed_limit: 0.15}]
      # Bypass ring: bp_nw(9) -- bp_ne(10) -- bp_se(11) -- bp_sw(12) -- bp_nw(9)
      - [9, 10, {speed_limit: 0.15}]
      - [10, 9, {speed_limit: 0.15}]
      - [10, 11, {speed_limit: 0.15}]
      - [11, 10, {speed_limit: 0.15}]
      - [11, 12, {speed_limit: 0.15}]
      - [12, 11, {speed_limit: 0.15}]
      - [12, 9, {speed_limit: 0.15}]
      - [9, 12, {speed_limit: 0.15}]
      # Connectors: cardinal midpoints to bypass ring corners
      - [4, 9, {speed_limit: 0.15}]
      - [9, 4, {speed_limit: 0.15}]
      - [4, 12, {speed_limit: 0.15}]
      - [12, 4, {speed_limit: 0.15}]
      - [5, 10, {speed_limit: 0.15}]
      - [10, 5, {speed_limit: 0.15}]
      - [5, 11, {speed_limit: 0.15}]
      - [11, 5, {speed_limit: 0.15}]
      - [6, 9, {speed_limit: 0.15}]
      - [9, 6, {speed_limit: 0.15}]
      - [6, 10, {speed_limit: 0.15}]
      - [10, 6, {speed_limit: 0.15}]
      - [7, 12, {speed_limit: 0.15}]
      - [12, 7, {speed_limit: 0.15}]
      - [7, 11, {speed_limit: 0.15}]
      - [11, 7, {speed_limit: 0.15}]
