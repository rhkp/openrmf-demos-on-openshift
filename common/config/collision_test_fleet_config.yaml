rmf_fleet:
  name: "tinyRobot"
  limits:
    linear: [0.5, 0.75]
    angular: [0.6, 2.0]
  profile:
    footprint: 0.3
    vicinity: 2.0
  reversible: true
  battery_system:
    voltage: 12.0
    capacity: 24.0
    charging_current: 5.0
  mechanical_system:
    mass: 20.0
    moment_of_inertia: 10.0
    friction_coefficient: 0.22
  ambient_system:
    power: 20.0
  tool_system:
    power: 0.0
  recharge_threshold: 0.10
  recharge_soc: 1.0
  publish_fleet_state: 10.0
  account_for_battery_drain: false
  task_capabilities:
    loop: true
    delivery: true
  finishing_request: "park"
  responsive_wait: true
  robots:
    tinyRobot1:
      charger: "wp_west"
    tinyRobot2:
      charger: "wp_east"
    tinyRobot3:
      charger: "wp_south"
    tinyRobot4:
      charger: "wp_north"

fleet_manager:
  ip: "127.0.0.1"
  port: 22011
  user: ""
  password: ""
